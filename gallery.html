<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageHeaderTitle">उत्सव गॅलरी</title>
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #050505;
      --gold-primary: #fbc531;
      --card-bg: #111111;
      --card-border: rgba(251, 197, 49, 0.2);
    }
    body {
      background-color: var(--bg-dark);
      color: #fff;
      font-family: 'Mukta', sans-serif;
      margin: 0; padding: 0;
    }
    .header {
      background: rgba(5, 5, 5, 0.95);
      padding: 15px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .back-btn {
      color: var(--gold-primary);
      text-decoration: none;
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .page-title {
      text-align: center;
      color: var(--gold-primary);
      font-size: 24px;
      font-weight: 800;
      margin: 20px 0;
    }
    .page-title span { font-size: 15px; color: #aaa; display: block; font-weight: 600; margin-top: 5px;}
    .page-title .subtitle-extra { color: var(--gold-primary); font-size: 16px; margin-top: 5px; }

    .container { max-width: 1000px; margin: 0 auto; padding: 0 15px; }

    /* --- हा सर्वात महत्त्वाचा डिझाईन बदल --- */
    .grid { 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); /* आता नेहमी २ बॉक्स दिसतील (इतर सेक्शन सारखे) */
      gap: 12px; 
      margin-bottom: 30px; 
      align-items: start; 
    }

    @media (min-width: 768px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }

    .photo-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      overflow: hidden;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      cursor: pointer;
      transition: 0.3s;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .photo-card::before {
      content: "";
      position: absolute;
      top: 45px;
      left: 50%;
      width: 26px;
      height: 26px;
      margin-left: -13px;
      border: 3px solid rgba(251, 197, 49, 0.1);
      border-top-color: var(--gold-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      z-index: 0;
    }

    .photo-card:hover { border-color: rgba(251, 197, 49, 0.5); transform: translateY(-3px); }

    .photo-card img {
      width: 100%;
      height: 150px; 
      object-fit: cover;
      display: block;
      position: relative;
      z-index: 1;
      image-rendering: high-quality;
      image-rendering: -webkit-optimize-contrast;
    }

    .photo-title { padding: 8px 5px; font-weight: 600; font-size: 14px; color: var(--gold-primary); min-height: 20px;}

    .section-divider {
      display: flex; align-items: center; text-align: center; color: var(--gold-primary); margin: 30px 0 20px;
    }
    .section-divider::before, .section-divider::after {
      content: ''; flex: 1; border-bottom: 1px solid var(--card-border);
    }
    .section-divider span { padding: 0 15px; font-size: 18px; font-weight: 800; }

    .day-container { margin-bottom: 30px; }
    
    .loading-text { text-align: center; color: var(--gold-primary); font-size: 16px; margin: 40px 0; font-weight: bold; }

    .modal {
      display: none; 
      position: fixed; 
      z-index: 9999; 
      padding-top: 50px; 
      left: 0; top: 0; 
      width: 100%; height: 100%; 
      background-color: rgba(0,0,0,0.95);
      backdrop-filter: blur(5px);
    }
    .modal-content {
      margin: auto;
      display: block;
      max-width: 95%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 5px;
      image-rendering: high-quality;
      image-rendering: -webkit-optimize-contrast;
    }
    .close-btn {
      position: absolute;
      top: 15px;
      right: 25px;
      color: #fff;
      font-size: 35px;
      font-weight: bold;
      cursor: pointer;
    }
    .close-btn:hover { color: var(--gold-primary); }
  </style>
</head>
<body>

  <div class="header">
    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> मागे जा</a>
  </div>

  <div class="container">
    <h1 class="page-title" id="mainTitle">
      उत्सव गॅलरी 
      <span>जय भवानी नवरात्र महोत्सव मंडळ, मंगळवेढा</span>
      <span class="subtitle-extra">जय भवानी प्रसन्न</span>
    </h1>

    <div id="loadingText" class="loading-text">फोटो लोड होत आहेत... <i class="fa-solid fa-spinner fa-spin"></i></div>

    <!-- ऑटोमॅटिक दिवस तयार करण्यासाठी कंटेनर -->
    <div id="dynamicDaysContainer"></div>

    <!-- इतर फोटो -->
    <div class="section-divider"><span>इतर फोटो</span></div>
    <div class="grid" id="otherGrid"></div>

  </div>

  <!-- The Modal -->
  <div id="imageModal" class="modal">
    <span class="close-btn" onclick="closeFullImg()">&times;</span>
    <img class="modal-content" id="fullImage">
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const year = urlParams.get('year') || '2026';

    document.getElementById('pageHeaderTitle').innerText = year + ' - उत्सव गॅलरी';
    document.getElementById('mainTitle').innerHTML = year + ' उत्सव गॅलरी <span>जय भवानी नवरात्र महोत्सव मंडळ, मंगळवेढा</span><span class="subtitle-extra">जय भवानी प्रसन्न</span>';

    const dayNames = [
      "पहिला दिवस", "दुसरा दिवस", "तिसरा दिवस", "चौथा दिवस", "पाचवा दिवस", 
      "सहावा दिवस", "सातवा दिवस", "आठवा दिवस", "नववा दिवस", "दहावा दिवस", "अकरावा दिवस"
    ];

    // फास्ट चेकिंग लॉजिक
    function imageExists(url) {
        return new Promise(resolve => {
            const img = new Image();
            img.onload = () => resolve(true);
            img.onerror = () => resolve(false);
            img.src = url;
        });
    }

    async function loadPhotos() {
        const container = document.getElementById('dynamicDaysContainer');
        container.innerHTML = "";
        let anyPhotoFound = false;

        for (let i = 1; i <= 11; i++) {
            let dayPhotos = [];
            
            // १. आधीचा जुना मुख्य फोटो चेक करा (उदा. 2026day1.jpg)
            let mainPic = `${year}/${year}day${i}.jpg`;
            if (await imageExists(mainPic)) {
                dayPhotos.push({url: mainPic, title: "मुख्य दर्शन"});
            }

            // २. नवीन एकाच दिवसाचे अनेक फोटो चेक करा (उदा. 2026day4_1.jpg)
            for (let j = 1; j <= 5; j++) {
                let subPic = `${year}/${year}day${i}_${j}.jpg`;
                if (await imageExists(subPic)) {
                    dayPhotos.push({url: subPic, title: `फोटो ${j}`});
                } else {
                    break; 
                }
            }

            // जर फोटो सापडले तरच स्क्रीनवर दाखवा
            if (dayPhotos.length > 0) {
                anyPhotoFound = true;
                let html = `<div class="day-container">`;
                html += `<div class="section-divider"><span>${dayNames[i-1]}</span></div>`;
                html += `<div class="grid">`;
                
                for(let photo of dayPhotos) {
                    html += `
                    <div class="photo-card" onclick="openFullImg('${photo.url}')">
                      <img src="${photo.url}" loading="lazy" alt="${photo.title}">
                      <div class="photo-title">${photo.title}</div>
                    </div>`;
                }
                html += `</div></div>`;
                container.innerHTML += html;
            }
        }

        document.getElementById('loadingText').style.display = "none";
        
        if (!anyPhotoFound) {
            container.innerHTML = `<div style="text-align:center; color:#aaa; margin: 30px 0;">या वर्षाचे फोटो अजून अपलोड केलेले नाहीत.</div>`;
        }

        loadOtherPhotos();
    }

    async function loadOtherPhotos() {
        const otherItems = [
          { file: 'sajavat.jpg', title: '✨ मंदिर देखावा' },
          { file: 'shringar.jpg', title: 'देवीचा श्रृंगार' },
          { file: 'vishesh.jpg', title: 'विशेष क्षण' },
          { file: 'aarti.jpg', title: 'महाआरती' }
        ];
        
        let otherHtml = '';
        for (let item of otherItems) {
            let url = `${year}/${year}${item.file}`;
            if (await imageExists(url)) {
                otherHtml += `
                <div class="photo-card" onclick="openFullImg('${url}')">
                  <img src="${url}" loading="lazy" alt="${item.title}">
                  <div class="photo-title">${item.title}</div>
                </div>`;
            }
        }
        document.getElementById('otherGrid').innerHTML = otherHtml;
    }

    function openFullImg(src) {
        document.getElementById("imageModal").style.display = "block";
        document.getElementById("fullImage").src = src;
    }
    function closeFullImg() {
        document.getElementById("imageModal").style.display = "none";
    }

    loadPhotos();
  </script>
</body>
</html>
