<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageHeaderTitle">उत्सव गॅलरी</title>
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #050505;
      --gold-primary: #fbc531;
      --card-bg: #111111;
      --card-border: rgba(251, 197, 49, 0.2);
    }
    body {
      background-color: var(--bg-dark);
      color: #fff;
      font-family: 'Mukta', sans-serif;
      margin: 0; padding: 0;
    }
    .header {
      background: rgba(5, 5, 5, 0.95);
      padding: 15px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .back-btn {
      color: var(--gold-primary);
      text-decoration: none;
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .page-title {
      text-align: center;
      color: var(--gold-primary);
      font-size: 24px;
      font-weight: 800;
      margin: 20px 0;
    }
    .page-title span { font-size: 15px; color: #aaa; display: block; font-weight: 600; margin-top: 5px;}
    .page-title .subtitle-extra { color: var(--gold-primary); font-size: 16px; margin-top: 5px; }

    .container { max-width: 1000px; margin: 0 auto; padding: 0 15px; }

    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); 
      gap: 15px; 
      margin-bottom: 15px; 
      align-items: start; 
    }

    /* Loading Spinner Animation */
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .photo-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      overflow: hidden;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      cursor: pointer;
      transition: 0.3s;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .photo-card::before {
      content: "";
      position: absolute;
      top: 45px;
      left: 50%;
      width: 26px;
      height: 26px;
      margin-left: -13px;
      border: 3px solid rgba(251, 197, 49, 0.1);
      border-top-color: var(--gold-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      z-index: 0;
    }

    .photo-card:hover { border-color: rgba(251, 197, 49, 0.5); transform: translateY(-3px); }

    .photo-card img {
      width: 100%;
      height: 140px; 
      object-fit: cover;
      display: block;
      position: relative;
      z-index: 1;
      /* ओरिजिनल क्वालिटी आणि शार्पनेससाठी CSS */
      image-rendering: high-quality;
      image-rendering: -webkit-optimize-contrast;
    }

    .photo-title { padding: 8px 5px; font-weight: 600; font-size: 14px; color: var(--gold-primary); min-height: 20px;}

    .section-divider {
      display: flex; align-items: center; text-align: center; color: var(--gold-primary); margin: 35px 0 20px;
    }
    .section-divider::before, .section-divider::after {
      content: ''; flex: 1; border-bottom: 1px solid var(--card-border);
    }
    .section-divider span { padding: 0 15px; font-size: 20px; font-weight: 800; }

    .day-container { margin-bottom: 40px; }
    
    .loading-text { text-align: center; color: var(--gold-primary); font-size: 18px; margin: 50px 0; font-weight: bold; }

    .modal {
      display: none; 
      position: fixed; 
      z-index: 9999; 
      padding-top: 50px; 
      left: 0; top: 0; 
      width: 100%; height: 100%; 
      background-color: rgba(0,0,0,0.95);
      backdrop-filter: blur(5px);
    }
    .modal-content {
      margin: auto;
      display: block;
      max-width: 95%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 5px;
      /* मोठ्या फोटोसाठी ओरिजिनल क्वालिटी सपोर्ट */
      image-rendering: high-quality;
      image-rendering: -webkit-optimize-contrast;
    }
    .close-btn {
      position: absolute;
      top: 15px;
      right: 25px;
      color: #fff;
      font-size: 35px;
      font-weight: bold;
      cursor: pointer;
    }
    .close-btn:hover { color: var(--gold-primary); }
  </style>
</head>
<body>

  <div class="header">
    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> मागे जा</a>
  </div>

  <div class="container">
    <h1 class="page-title" id="mainTitle">
      उत्सव गॅलरी 
      <span>जय भवानी नवरात्र महोत्सव मंडळ, मंगळवेढा</span>
      <span class="subtitle-extra">जय भवानी प्रसन्न</span>
    </h1>

    <div id="loadingText" class="loading-text">गॅलरी लोड होत आहे... <i class="fa-solid fa-spinner fa-spin"></i></div>

    <!-- ऑटोमॅटिक दिवस तयार करण्यासाठी कंटेनर -->
    <div id="dynamicDaysContainer"></div>

    <!-- इतर फोटो -->
    <div class="section-divider"><span>इतर</span></div>
    <div class="grid" id="otherGrid"></div>

  </div>

  <!-- The Modal -->
  <div id="imageModal" class="modal">
    <span class="close-btn" onclick="closeFullImg()">&times;</span>
    <img class="modal-content" id="fullImage" loading="lazy" decoding="async">
  </div>

  <script>
    // GitHub Repo ची माहिती (येथे तुमचे युझरनेम आणि रेपो नाव टाका, उदा. "jaybhavanimangalwedha/navratri")
    const GITHUB_REPO = "jaybhavanimangalwedha/jaybhavanimangalwedha.github.io"; 

    const urlParams = new URLSearchParams(window.location.search);
    const year = urlParams.get('year') || '2017';

    document.getElementById('pageHeaderTitle').innerText = year + ' - उत्सव गॅलरी';
    document.getElementById('mainTitle').innerHTML = year + ' उत्सव गॅलरी <span>जय भवानी नवरात्र महोत्सव मंडळ, मंगळवेढा</span><span class="subtitle-extra">जय भवानी प्रसन्न</span>';

    const fallbackImg = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';

    const dayNames = [
      "पहिला दिवस", "दुसरा दिवस", "तिसरा दिवस", "चौथा दिवस", "पाचवा दिवस", 
      "सहावा दिवस", "सातवा दिवस", "आठवा दिवस", "नववा दिवस", "दहावा दिवस", "अकरावा दिवस"
    ];

    async function loadGallery() {
        const url = `https://api.github.com/repos/${GITHUB_REPO}/contents/${year}`;
        
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error('Network response was not ok');
            const files = await response.json();
            
            // फक्त इमेजेस फिल्टर करणे
            const images = files.filter(f => f.name.endsWith('.jpg') || f.name.endsWith('.png'));
            
            let daysData = {}; 

            images.forEach(img => {
                let name = img.name;
                
                // जर फाईलचे नाव year+day+num (उदा. 2026day4.jpg किंवा 2026day4_1.jpg) असेल
                let match = name.match(new RegExp(`^${year}day(\\d+)(?:_\\d+)?\\.jpg$`));
                if(match) {
                    let dayNum = match[1];
                    if(!daysData[dayNum]) daysData[dayNum] = [];
                    // Raw ओरिजिनल फाईल वापरण्यासाठी download_url
                    daysData[dayNum].push(img.download_url); 
                }
            });

            const container = document.getElementById('dynamicDaysContainer');
            container.innerHTML = ""; 
            document.getElementById('loadingText').style.display = "none";

            let foundAnyDay = false;
            for(let i=1; i<=11; i++) {
                let dayStr = i.toString();
                if(daysData[dayStr] && daysData[dayStr].length > 0) {
                    foundAnyDay = true;
                    
                    let html = `<div class="day-container">`;
                    html += `<div class="section-divider"><span>${dayNames[i-1]}</span></div>`;
                    html += `<div class="grid">`;
                    
                    daysData[dayStr].forEach((imgUrl, index) => {
                        let titleText = daysData[dayStr].length > 1 ? `फोटो ${index + 1}` : "दर्शन";
                        html += `
                            <div class="photo-card" onclick="openFullImg('${imgUrl}')">
                              <img src="${imgUrl}" loading="lazy" decoding="async" alt="Day ${i} Photo ${index+1}" onerror="this.onerror=null; this.src='${fallbackImg}';">
                              <div class="photo-title">${titleText}</div>
                            </div>
                        `;
                    });
                    
                    html += `</div></div>`;
                    container.innerHTML += html;
                }
            }

            if(!foundAnyDay) {
                container.innerHTML = `<div style="text-align:center; color:#aaa; margin: 30px 0;">या वर्षाचे फोटो अजून उपलब्ध नाहीत.</div>`;
            }

            // इतर फोटो लोड करणे
            loadOtherPhotos(images);

        } catch (error) {
            console.error("Error loading gallery:", error);
            document.getElementById('loadingText').innerText = "फोटो लोड करताना अडचण आली. पेज रिफ्रेश करा.";
        }
    }

    function loadOtherPhotos(images) {
        const otherItems = [
          { file: 'sajavat.jpg', title: '✨ मंदिर देखावा' },
          { file: 'shringar.jpg', title: 'देवीचा श्रृंगार' },
          { file: 'vishesh.jpg', title: 'विशेष क्षण' },
          { file: 'aarti.jpg', title: 'महाआरती' }
        ];

        let otherHtml = '';
        otherItems.forEach(item => {
            let expectedName = `${year}${item.file}`;
            let foundImage = images.find(img => img.name === expectedName);
            let imgSrc = foundImage ? foundImage.download_url : `${year}/${expectedName}`;
            
            otherHtml += `
            <div class="photo-card" onclick="openFullImg(this.querySelector('img').src)">
              <img src="${imgSrc}" loading="lazy" decoding="async" alt="${item.title}" onerror="this.onerror=null; this.src='${fallbackImg}';">
              <div class="photo-title">${item.title}</div>
            </div>
            `;
        });
        document.getElementById('otherGrid').innerHTML = otherHtml;
    }

    function openFullImg(src) {
      if (src !== fallbackImg) {
        document.getElementById("imageModal").style.display = "block";
        document.getElementById("fullImage").src = src;
      }
    }
    function closeFullImg() {
      document.getElementById("imageModal").style.display = "none";
    }

    loadGallery();

  </script>

</body>
</html>
