<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageHeaderTitle">उत्सव गॅलरी</title>
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #050505;
      --gold-primary: #fbc531;
      --card-bg: #111111;
      --card-border: rgba(251, 197, 49, 0.2);
    }
    body {
      background-color: var(--bg-dark);
      color: #fff;
      font-family: 'Mukta', sans-serif;
      margin: 0; padding: 0;
    }
    .header {
      background: rgba(5, 5, 5, 0.95);
      padding: 15px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .back-btn {
      color: var(--gold-primary);
      text-decoration: none;
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .page-title {
      text-align: center;
      color: var(--gold-primary);
      font-size: 24px;
      font-weight: 800;
      margin: 20px 0;
    }
    .page-title span { font-size: 15px; color: #aaa; display: block; font-weight: 600; margin-top: 5px;}
    .page-title .subtitle-extra { color: var(--gold-primary); font-size: 16px; margin-top: 5px; }

    .container { max-width: 1000px; margin: 0 auto; padding: 0 15px; }

    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); 
      gap: 15px; 
      margin-bottom: 30px; 
      align-items: start; 
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }

    .photo-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      overflow: hidden;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      cursor: pointer;
      transition: 0.3s;
      display: flex;
      flex-direction: column;
      position: relative; 
    }

    .photo-card::before {
      content: "";
      position: absolute;
      top: 45px;
      left: 50%;
      width: 26px;
      height: 26px;
      margin-left: -13px;
      border: 3px solid rgba(251, 197, 49, 0.1);
      border-top-color: var(--gold-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      z-index: 0;
    }

    .photo-card.loaded::before {
      display: none;
    }

    .photo-card:hover { border-color: rgba(251, 197, 49, 0.5); transform: translateY(-3px); }

    .photo-card img {
      width: 100%;
      height: 120px; 
      object-fit: cover;
      display: block;
      border-bottom: 1px solid var(--card-border);
      position: relative;
      z-index: 1; 
      background-color: transparent;
    }

    .photo-title { padding: 10px; font-weight: 600; font-size: 15px; color: var(--gold-primary); min-height: 20px;}

    .section-divider {
      display: flex; align-items: center; text-align: center; color: var(--gold-primary); margin: 30px 0 20px;
    }
    .section-divider::before, .section-divider::after {
      content: ''; flex: 1; border-bottom: 1px solid var(--card-border);
    }
    .section-divider span { padding: 0 15px; font-size: 18px; font-weight: 800; }

    .modal {
      display: none; 
      position: fixed; 
      z-index: 9999; 
      padding-top: 50px; 
      left: 0; top: 0; 
      width: 100%; height: 100%; 
      background-color: rgba(0,0,0,0.95);
    }
    .modal-content {
      margin: auto;
      display: block;
      max-width: 95%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 5px;
    }
    .close-btn {
      position: absolute;
      top: 15px;
      right: 25px;
      color: #fff;
      font-size: 35px;
      font-weight: bold;
      cursor: pointer;
    }
    .close-btn:hover { color: var(--gold-primary); }
  </style>
</head>
<body>

  <div class="header">
    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> मागे जा</a>
  </div>

  <div class="container">
    <h1 class="page-title" id="mainTitle">
      उत्सव गॅलरी 
      <span>जय भवानी नवरात्र महोत्सव मंडळ, मंगळवेढा</span>
      <span class="subtitle-extra">जय भवानी प्रसन्न</span>
    </h1>

    <div class="section-divider"><span>१० दिवसांचे फोटो</span></div>
    <div class="grid" id="daysGrid"></div>

    <div class="section-divider"><span>इतर</span></div>
    <div class="grid" id="otherGrid"></div>

  </div>

  <!-- The Modal -->
  <div id="imageModal" class="modal">
    <span class="close-btn" onclick="closeFullImg()">&times;</span>
    <img class="modal-content" id="fullImage" decoding="async">
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const year = urlParams.get('year') || '2017';

    document.getElementById('pageHeaderTitle').innerText = year + ' - उत्सव गॅलरी';
    document.getElementById('mainTitle').innerHTML = year + ' उत्सव गॅलरी <span>जय भवानी नवरात्र महोत्सव मंडळ, मंगळवेढा</span><span class="subtitle-extra">जय भवानी प्रसन्न</span>';

    const dayNames = [
      "पहिला दिवस", "दुसरा दिवस", "तिसरा दिवस", "चौथा दिवस", "पाचवा दिवस", 
      "सहावा दिवस", "सातवा दिवस", "आठवा दिवस", "नववा दिवस", "दहावा दिवस"
    ];

    const otherItemsList = [
      { file: 'sajavat.jpg', title: '✨ मंदिर देखावा' },
      { file: 'shringar.jpg', title: 'देवीचा श्रृंगार' },
      { file: 'vishesh.jpg', title: 'विशेष क्षण' },
      { file: 'aarti.jpg', title: 'महाआरती' },
      { file: 'rath.jpg', title: 'देवीरथ सजावट' },
      { file: 'rangoli.jpg', title: 'विशेष रांगोळी' },
      { file: 'bhakti.jpg', title: 'भक्तिमय क्षण' },
      { file: 'miravnuk.jpg', title: 'दसरा मिरवणूक क्षण' }
    ];

    // सर्व फोटो लोड करायची एकच 'स्मार्ट रांग' (Queue) तयार केली आहे.
    // ही रांग एका वेळी फक्त एकाच फोटोला इंटरनेटवरून बोलावेल.
    
    let loadQueue = [];

    // १. १० दिवसांचे मुख्य फोटो रांगेत टाका
    for (let i = 1; i <= 10; i++) {
      loadQueue.push({
        type: 'main_day',
        dayIndex: i,
        src: `${year}/${year}day${i}.jpg`,
        title: dayNames[i-1]
      });
    }

    // २. 'इतर' मधील फोटो रांगेत टाका
    otherItemsList.forEach(item => {
      loadQueue.push({
        type: 'other_item',
        src: `${year}/${year}${item.file}`,
        title: item.title
      });
    });

    let queueIndex = 0;

    function processNextPhotoInQueue() {
      if (queueIndex >= loadQueue.length) {
        // मुख्य फोटो संपल्यावर उप-फोटोंना (Sub-photos) सुरुवात करा
        startSubPhotosLoading();
        return;
      }

      let item = loadQueue[queueIndex];
      queueIndex++;

      let tempImg = new Image();
      tempImg.onload = function() {
        // फोटो सापडला! आता स्क्रीनवर कार्ड बनवा
        const card = document.createElement('div');
        card.className = 'photo-card loaded';
        card.onclick = function() { openFullImg(item.src); };
        card.innerHTML = `
          <img src="${item.src}" decoding="async" alt="${item.title}">
          <div class="photo-title">${item.title}</div>
        `;

        if (item.type === 'main_day') {
          card.id = `main-day-${item.dayIndex}`;
          document.getElementById('daysGrid').appendChild(card);
          // मुख्य फोटो लोड झाल्यावर लगेच त्याच्या पहिल्या उप-फोटॉची साखळी चालू करा
          checkSubImage(item.dayIndex, 1);
        } else {
          document.getElementById('otherGrid').appendChild(card);
        }

        // हा फोटो लोड झाला, आता लगेच रांगेतल्या पुढच्या फोटोला बोलवा!
        processNextPhotoInQueue();
      };

      tempImg.onerror = function() {
        // मुख्य फोटो नसेल तर तो बॉक्स अजिबात बनवणार नाही, थेट पुढच्या फोटोकडे जा
        processNextPhotoInQueue();
      };

      tempImg.src = item.src;
    }

    // ३. उप-फोटो तपासण्याची साखळी (एकमेकांमागोमाग तपासणे)
    function checkSubImage(dayIndex, subIndex) {
      if (subIndex > 5) return;

      let subImgSrc = `${year}/${year}day${dayIndex}_${subIndex}.jpg`;
      let tempImg = new Image();

      tempImg.onload = function() {
        const card = document.createElement('div');
        card.className = 'photo-card loaded';
        card.id = `sub-${dayIndex}-${subIndex}`;
        card.onclick = function() { openFullImg(subImgSrc); };
        card.innerHTML = `
          <img src="${subImgSrc}" decoding="async" alt="${dayNames[dayIndex-1]} (फोटो ${subIndex})">
          <div class="photo-title">${dayNames[dayIndex-1]} (फोटो ${subIndex})</div>
        `;

        let prevElem = subIndex === 1 
          ? document.getElementById(`main-day-${dayIndex}`) 
          : document.getElementById(`sub-${dayIndex}-${subIndex - 1}`);
        
        if (prevElem && prevElem.parentNode) {
          prevElem.insertAdjacentElement('afterend', card);
        } else {
          document.getElementById('daysGrid').appendChild(card);
        }

        // पहिला उप-फोटो सापडला, तरच पुढचा (_2) तपासा
        checkSubImage(dayIndex, subIndex + 1);
      };

      tempImg.onerror = function() {
        // उप-फोटो नाही, तिथेच थांबा
      };

      tempImg.src = subImgSrc;
    }

    function startSubPhotosLoading() {
      // सर्व मुख्य फोटो लोड झाल्याची पायरी पूर्ण झाली
    }

    // गॅलरी उघडताच पहिली प्रक्रिया सुरू करा
    window.onload = function() {
      processNextPhotoInQueue();
    };

    function openFullImg(src) {
      if (src) {
        document.getElementById("imageModal").style.display = "block";
        document.getElementById("fullImage").src = src;
      }
    }
    function closeFullImg() {
      document.getElementById("imageModal").style.display = "none";
      document.getElementById("fullImage").src = "";
    }
  </script>
</body>
</html>
